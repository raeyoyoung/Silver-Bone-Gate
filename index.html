<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Bone Gate — Threshold</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#dce5e8;font-family:Georgia,serif}body{overflow:hidden}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;display:grid;place-items:end center;padding-bottom:7vh;pointer-events:none}#panel{text-align:center;pointer-events:auto}button{background:#0d1115;color:#e8f1f4;border:1px solid #91a4af;padding:14px 30px;letter-spacing:.22em;cursor:pointer;font:12px monospace}button:disabled{opacity:.45;cursor:wait}#status{font:11px monospace;letter-spacing:.1em;color:#a2b2b9;margin-bottom:20px;max-width:80vw}#black{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1s}#arrival{position:fixed;inset:0;background:#000;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:opacity 1.6s}#arrival.visible{opacity:1;pointer-events:auto}#arrival h1{font-weight:normal;letter-spacing:.2em}#arrival p{font:12px monospace;color:#9ba7aa}#restart{margin-top:20px}
</style></head><body><div id="stage"></div><div id="ui"><div id="panel"><div id="status">LOADING THE BONE GATES…</div><button id="enter" disabled>ENTER</button></div></div><div id="black"></div><div id="arrival"><div><h1>YOU HAVE ARRIVED</h1><p>YOUR DIGITAL WORLD BEGINS HERE</p><button id="restart">RETURN</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const status=document.getElementById('status'),enter=document.getElementById('enter'),black=document.getElementById('black'),arrival=document.getElementById('arrival');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,1000);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('stage').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd7ecff,0x18202a,2.4));for(const [x,y,z,intensity] of [[-3,5,8,120],[4,2,5,90],[0,-3,-4,55]]){const light=new THREE.PointLight(0xffffff,intensity);light.position.set(x,y,z);scene.add(light)}
let doors=[],ready=false,opening=false,start=0;const duration=4200;
function placeDoor(object,left,centerX){const bounds=new THREE.Box3().setFromObject(object);const hingeX=left?bounds.min.x:bounds.max.x;const hinge=new THREE.Group();hinge.position.x=hingeX;scene.add(hinge);object.position.x-=hingeX;hinge.add(object);return {hinge,left}}
const loader=new GLTFLoader();
async function loadCompressedGate(){
 try {
  if(!('DecompressionStream' in window)) throw new Error('This browser does not support gzip decompression.');
  const response=await fetch('bone-gates-web.glb.gz2');
  if(!response.ok) throw new Error('Model request failed: HTTP '+response.status);
  status.textContent='UNSEALING THE BONE GATES…';
  const decompressed=response.body.pipeThrough(new DecompressionStream('gzip'));
  const buffer=await new Response(decompressed).arrayBuffer();
  loader.parse(buffer,window.location.href,gltf=>{
 const root=gltf.scene;root.updateMatrixWorld(true);let left=root.getObjectByName('Left Bone Gate'),right=root.getObjectByName('Right Bone Gate');
 if(!left||!right)throw new Error('Gate names not found');
 // Preserve Nomad's original node transforms by attaching the parent transforms to each mesh.
 root.updateMatrixWorld(true);for(const obj of [left,right]){obj.updateMatrixWorld(true);const matrix=obj.matrixWorld.clone();obj.removeFromParent();obj.matrix.copy(matrix);obj.matrix.decompose(obj.position,obj.quaternion,obj.scale);obj.matrixAutoUpdate=true;scene.add(obj);obj.traverse(child=>{if(child.isMesh){child.material=new THREE.MeshStandardMaterial({color:0xc7d3dc,metalness:.88,roughness:.18,side:THREE.DoubleSide});}})}
 let bounds=new THREE.Box3().setFromObject(left).union(new THREE.Box3().setFromObject(right));const c=bounds.getCenter(new THREE.Vector3());const size=bounds.getSize(new THREE.Vector3());
 // Center the entire sculpture before positioning outer hinges.
 for(const obj of [left,right])obj.position.sub(c);
 bounds=new THREE.Box3().setFromObject(left).union(new THREE.Box3().setFromObject(right));const maxDim=Math.max(bounds.getSize(new THREE.Vector3()).x,bounds.getSize(new THREE.Vector3()).y);camera.position.set(0,0,maxDim*2.6);camera.lookAt(0,0,0);
 doors=[placeDoor(left,true),placeDoor(right,false)];ready=true;enter.disabled=false;status.textContent='THE THRESHOLD';
},err=>{console.error(err);status.textContent='MODEL COULD NOT LOAD: '+err.message;});
 } catch(err) { console.error(err);status.textContent='MODEL COULD NOT LOAD: '+err.message; }
}
loadCompressedGate();
function sound(){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C(),t=ctx.currentTime;for(const [f,d,len,v] of [[130,0,.3,.08],[67,.15,3.9,.035],[42,.6,6,.025]]){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+d);o.frequency.exponentialRampToValueAtTime(Math.max(20,f*.5),t+d+len);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(v,t+d+.06);g.gain.exponentialRampToValueAtTime(.0001,t+d+len);o.connect(g).connect(ctx.destination);o.start(t+d);o.stop(t+d+len+.01)}setTimeout(()=>ctx.close(),7500)}catch(e){}}
enter.onclick=()=>{if(!ready||opening)return;opening=true;start=performance.now();enter.disabled=true;sound();setTimeout(()=>{black.style.opacity='1'},4300);setTimeout(()=>{arrival.classList.add('visible');document.getElementById('ui').style.display='none'},8000)};
document.getElementById('restart').onclick=()=>location.reload();
function animate(now){requestAnimationFrame(animate);if(opening){const p=Math.min(1,(now-start)/duration),e=1-Math.pow(1-p,3);for(const d of doors)d.hinge.rotation.y=(d.left?-1:1)*e*1.85}renderer.render(scene,camera)}animate(0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
